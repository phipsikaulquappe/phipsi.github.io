<!DOCTYPE html>
<html lang="en">
<head>
    <script>
    (function() {
        const savedTheme = localStorage.getItem("siteTheme");
        if (savedTheme) {
            document.addEventListener("DOMContentLoaded", function(){
                document.body.classList.add(savedTheme);
            });
        }
    })();
    </script>

    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
    {% if page.title %}
        {{ page.title }} – {{ site.title }}
    {% else %}
        {{ site.title }}
    {% endif %}
    </title>

    <link rel="canonical" href="{{ site.url }}{{ page.url }}">
    <meta name="description" content="Leipzig based artist exploring material and spatial relations.">

    <meta property="og:title" content="{{ page.title }} — {{ site.title }}">
    <meta property="og:description" content="Philipp Albrecht – Künstler aus Leipzig, studiert an der HGB - Hochschule für Grafik und Buchkunst Leipzig.">    <meta property="og:image" content="{{ site.url }}{{ page.thumbnail }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">

    <meta name="author" content="Philipp Albrecht">
    <meta name="robots" content="index, follow">

    <meta name="twitter:card" content="summary_large_image">

    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/png" href="/assets/favicon12.png">
    <link rel="apple-touch-icon" href="/assets/favicon12.png">

    <link rel="preload" href="/style.css" as="style">
    <link rel="preload" href="/assets/cursor-default.png" as="image">

    <script type="application/ld+json">
    {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Philipp Albrecht",
    "url": "https://www.philippalbrecht.de",
    "jobTitle": "Artist",
    "description": "Leipzig-based artist studying at HGB Hochschule für Grafik und Buchkunst Leipzig, exploring material and spatial relations.", 
    "knowsAbout": ["sculpture", "installation art", "media art", "art history"],   
    "address": {
        "@type": "PostalAddress",
        "addressLocality": "Leipzig",
        "addressCountry": "DE"
    },
    "alumniOf": [
        {
            "@type": "CollegeOrUniversity",
            "name": "Hochschule für Grafik und Buchkunst Leipzig",
            "alternateName": "HGB Leipzig"
        },
        {
            "@type": "CollegeOrUniversity",
            "name": "Universität Leipzig",
            "department": "Kunstgeschichte",
            "description": "Bachelor of Arts in Art History"
        }
     ],
    "performerIn": {
        "@type": "ExhibitionEvent",
        "name": "Inter(-)Views",
        "url": "https://www.hgb-leipzig.de/hochschule/kalender/2892",
        "startDate": "2026-05-19",
        "endDate": "2026-06-03",
        "location": {
        "@type": "Place",
        "name": "HGB Galerie",
        "address": "Wächterstraße 11, 04107 Leipzig"
        },
        "organizer": {
        "@type": "Organization",
        "name": "Hochschule für Grafik und Buchkunst Leipzig"
        }
    },

    "sameAs": [
        "https://philippalbrecht.bandcamp.com"
    ]
    }
    </script>

</head>

<body class="theme-gray">

    <div id="lightbox" class="lightbox hidden">

        <button class="slideshow-close" id="slideshowClose" aria-label="Close">
            <img src="/assets/x.png" alt=""
                 onerror="this.style.display='none'; this.parentElement.innerHTML='×';">
        </button>

        <button class="slideshow-nav slideshow-nav-left" id="slideshowNavLeft" aria-label="Previous image">
            <img src="/assets/prev.png" alt="">
        </button>

        <img class="lightbox-image" src="" alt="">

        <button class="slideshow-nav slideshow-nav-right" id="slideshowNavRight" aria-label="Next image">
            <img src="/assets/next.png" alt="">
        </button>

    </div>

    <div class="layout">
        {% include header.html %}
        {% include sidebar.html %}

        <main class="main">
            {{ content }}
            {% unless page.hide_project_navigation %}
                {% include project-navigation.html %}
            {% endunless %}
        </main>
    </div>

    <script src="/main.js"></script>
</body>
</html>
