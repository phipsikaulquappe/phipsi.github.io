<!DOCTYPE html>
<html lang="en">
<head>
    <script>
    (function() {
        const savedTheme = localStorage.getItem("siteTheme");
        if (savedTheme) {
            document.addEventListener("DOMContentLoaded", function(){
                document.body.classList.add(savedTheme);
            });
        }
    })();
    </script>

    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
    {% if page.title %}
        {{ page.title }} – {{ site.title }}
    {% else %}
        {{ site.title }}
    {% endif %}
    </title>

    <link rel="canonical" href="{{ site.url }}{{ page.url }}">
    <meta name="description" content="Leipzig-based artist exploring material and spacial relations.">

    <meta property="og:title" content="{{ page.title }} — {{ site.title }}">
    <meta property="og:description" content="Artist portfolio">
    <meta property="og:image" content="{{ site.url }}{{ page.thumbnail }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">

    <meta name="twitter:card" content="summary_large_image">

    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/png" href="/assets/favicon12.png">
    <link rel="apple-touch-icon" href="/assets/favicon7.png">
</head>

<body class="theme-red">

    <div id="lightbox" class="lightbox hidden">

        <button class="slideshow-close" id="slideshowClose" aria-label="Close">
            <img src="/assets/x.png" alt=""
                 onerror="this.style.display='none'; this.parentElement.innerHTML='×';">
        </button>

        <button class="slideshow-nav slideshow-nav-left" id="slideshowNavLeft" aria-label="Previous image">
            <img src="/assets/prev.png" alt="">
        </button>

        <img class="lightbox-image" src="" alt="">

        <button class="slideshow-nav slideshow-nav-right" id="slideshowNavRight" aria-label="Next image">
            <img src="/assets/next.png" alt="">
        </button>

    </div>

    <div class="layout">
        {% include header.html %}
        {% include sidebar.html %}

        <main class="main">
            {{ content }}
            {% include project-navigation.html %}
        </main>
    </div>

    <script src="/main.js"></script>
</body>
</html>
